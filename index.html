<html>
<head>
    <title>大韓航空SKYPASSマイル単価計算ツール</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
</head>
<body>
    <main>
        <h1>SKYPASS マイル単価計算</h1>
        <p class="calculation-warning">※ 出力される区間マイルはIATAのTPM（Ticketed Point Mileage）とは異なるため、実際のSKYPASS積算マイルと少し異なります。</p>
        <fieldset class="calculation-note">
            <legend>区間マイル計算方法</legend>
            <p>区間マイルは空港の座標から大圏距離を算出し、区間ごとに四捨五入しています。</p>
            <p>獲得マイルは、往路・復路それぞれの合計区間マイルに航空会社・予約クラスごとの積算率を掛け、小数点以下を切り捨てて計算します。</p>
            <p>マイル単価は「往復航空券の金額 ÷ 往復の獲得マイル」です。</p>
        </fieldset>
        <div class="form-grid">
            <fieldset class="trip-group outbound-group">
                <legend>往路</legend>
                <div class="field">
                    <label for="origin">出発地</label>
                    <input type="text" id="origin" placeholder="空港コード 例: NRT" autocomplete="off" autocapitalize="characters" />
                </div>
                <div class="field">
                    <label for="via">経由地</label>
                    <input type="text" id="via" placeholder="任意" autocomplete="off" autocapitalize="characters" />
                </div>
                <div class="field">
                    <label for="destination">目的地</label>
                    <input type="text" id="destination" placeholder="空港コード 例: ICN" autocomplete="off" autocapitalize="characters" />
                </div>
                <div class="field">
                    <label for="outboundReservationClass">予約クラス</label>
                    <select id="outboundReservationClass">
                        <option value="">選択してください</option>
                    </select>
                </div>
            </fieldset>
            <fieldset class="trip-group return-group">
                <legend>復路</legend>
                <p class="trip-note">経路は往路の逆順です。経由地がある場合は、経由地を通って戻る経路として計算します。</p>
                <div class="field">
                    <label for="returnReservationClass">予約クラス</label>
                    <select id="returnReservationClass">
                        <option value="">選択してください</option>
                    </select>
                </div>
            </fieldset>
            <div class="field">
                <label for="airline">航空会社</label>
                <select id="airline">
                    <option value="KE" selected>大韓航空</option>
                    <option value="DL">デルタ航空</option>
                    <option value="AR">アルゼンチン航空</option>
                    <option value="AM">アエロメヒコ航空</option>
                    <option value="UX">エア・ヨーロッパ</option>
                    <option value="AF">エールフランス航空</option>
                    <option value="CI">チャイナエアライン</option>
                    <option value="MU">中国東方航空</option>
                    <option value="GA">ガルーダ・インドネシア航空</option>
                    <option value="KQ">ケニア航空</option>
                    <option value="KL">KLMオランダ航空</option>
                    <option value="ME">ミドル・イースト航空</option>
                    <option value="SV">サウディア航空</option>
                    <option value="SK">スカンジナビア航空</option>
                    <option value="RO">タロム航空</option>
                    <option value="VN">ベトナム航空</option>
                    <option value="VS">ヴァージン・アトランティック航空</option>
                    <option value="MF">廈門航空</option>
                </select>
            </div>
            <div class="field">
                <label for="cabin">客室クラス</label>
                <select id="cabin"></select>
            </div>
            <div class="field">
                <label for="price">往復航空券の金額（円）</label>
                <input type="number" id="price" placeholder="例: 50000" min="0" inputmode="numeric" />
            </div>
            <button type="button" onclick="calc()">計算</button>
        </div>
        <div id="result" aria-live="polite"></div>
    </main>
</body>
</html>
